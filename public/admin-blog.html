<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Blog-Verwaltung - Binso Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      display: flex;
      min-height: 100vh;
    }
    
    /* Sidebar styles (same as before) */
    .sidebar {
      width: 70px;
      background: #000;
      color: #fff;
      position: fixed;
      left: 0;
      top: 0;
      height: 100vh;
      transition: width 0.3s ease;
      overflow: hidden;
      z-index: 1000;
    }
    .sidebar.expanded { width: 280px; }
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #333;
      display: flex;
      align-items: center;
    }
    .hamburger {
      width: 30px;
      height: 30px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      flex-shrink: 0;
    }
    .hamburger span {
      display: block;
      height: 2px;
      background: #fff;
    }
    .logo { font-size: 18px; font-weight: 600; white-space: nowrap; opacity: 0; margin-left: 16px; }
    .sidebar.expanded .logo { opacity: 1; }
    .nav-items { margin-top: 20px; }
    .nav-item {
      display: flex;
      align-items: center;
      padding: 15px 20px;
      color: #999;
      text-decoration: none;
      transition: 0.2s;
      white-space: nowrap;
    }
    .nav-item:hover, .nav-item.active { background: #1a1a1a; color: #fff; }
    .nav-item svg { min-width: 24px; margin-right: 15px; }
    .nav-text { opacity: 0; transition: opacity 0.3s; }
    .sidebar.expanded .nav-text { opacity: 1; }

    /* Main Content */
    .main-content {
      margin-left: 70px;
      flex: 1;
      transition: margin-left 0.3s ease;
      padding: 30px;
    }
    .sidebar.expanded + .main-content { margin-left: 280px; }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }
    h1 { font-size: 28px; }
    
    .btn {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
      transition: 0.2s;
    }
    .btn-primary {
      background: #000;
      color: #fff;
    }
    .btn-primary:hover { background: #333; }
    
    /* Tabs */
    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
      border-bottom: 1px solid #ddd;
      padding-bottom: 10px;
    }
    .tab {
      padding: 8px 16px;
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 14px;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: 0.2s;
    }
    .tab:hover { color: #000; }
    .tab.active { color: #000; border-bottom-color: #000; font-weight: 600; }
    
    /* Blog Posts List */
    .posts-list {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;
    }
    .post-item {
      padding: 20px;
      border-bottom: 1px solid #f0f0f0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: 0.2s;
      cursor: pointer;
    }
    .post-item:hover { background: #fafafa; }
    .post-info h3 {
      font-size: 16px;
      margin-bottom: 6px;
    }
    .post-meta {
      font-size: 13px;
      color: #999;
    }
    .post-status {
      padding: 4px 12px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 500;
    }
    .status-published { background: #e6ffe6; color: #006600; }
    .status-draft { background: #ffe6e6; color: #660000; }
    
    /* Editor Modal */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.8);
      z-index: 2000;
      overflow-y: auto;
    }
    .modal.active { display: block; }
    .modal-content {
      background: #fff;
      max-width: 900px;
      margin: 40px auto;
      border-radius: 12px;
    }
    .modal-header {
      padding: 20px;
      border-bottom: 1px solid #eee;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .modal-close {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
    }
    .modal-body { padding: 20px; }
    .form-group {
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
      font-size: 14px;
    }
    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 6px;
      font-size: 14px;
    }
    .form-group textarea { min-height: 200px; resize: vertical; font-family: monospace; }
    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }
    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-end;
      padding: 20px;
      border-top: 1px solid #eee;
    }
  </style>
</head>
<body>
  <!-- Sidebar -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="hamburger" onclick="toggleSidebar()">
        <span></span>
        <span></span>
        <span></span>
      </div>
      <div class="logo">binso</div>
    </div>
    <div class="nav-items">
      <a href="/admin-dashboard.html" class="nav-item">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/></svg>
        <span class="nav-text">Dashboard</span>
      </a>
      <a href="/admin-analytics.html" class="nav-item">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
        <span class="nav-text">Analytics</span>
      </a>
      <a href="/admin-blog.html" class="nav-item active">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><line x1="10" y1="9" x2="8" y2="9"/></svg>
        <span class="nav-text">Blog</span>
      </a>
      <a href="/admin-media.html" class="nav-item">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        <span class="nav-text">Medien</span>
      </a>
      <a href="/admin-settings.html" class="nav-item">
        <svg width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6"/></svg>
        <span class="nav-text">Einstellungen</span>
      </a>
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <h1>Blog-Verwaltung</h1>
      <button class="btn btn-primary" onclick="openEditor()">Neuer Artikel</button>
    </div>

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" data-status="all">Alle</button>
      <button class="tab" data-status="published">Veröffentlicht</button>
      <button class="tab" data-status="draft">Entwürfe</button>
    </div>

    <!-- Posts List -->
    <div class="posts-list" id="postsList">
      <div style="padding: 40px; text-align: center; color: #999;">Laden...</div>
    </div>
  </div>

  <!-- Editor Modal -->
  <div class="modal" id="editorModal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="editorTitle">Neuer Blog-Artikel</h2>
        <button class="modal-close" onclick="closeEditor()">&times;</button>
      </div>
      <div class="modal-body">
        <form id="postForm">
          <input type="hidden" id="postId">
          
          <div class="form-group">
            <label>Titel *</label>
            <input type="text" id="postTitle" required>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Slug (URL)</label>
              <input type="text" id="postSlug">
            </div>
            <div class="form-group">
              <label>Kategorie</label>
              <input type="text" id="postCategory">
            </div>
          </div>
          
          <div class="form-group">
            <label>Auszug</label>
            <textarea id="postExcerpt" style="min-height: 80px;"></textarea>
          </div>
          
          <div class="form-group">
            <label>Inhalt (Markdown/HTML) *</label>
            <textarea id="postContent" required></textarea>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Featured Image URL</label>
              <input type="text" id="postImage">
            </div>
            <div class="form-group">
              <label>Tags (kommagetrennt)</label>
              <input type="text" id="postTags" placeholder="technologie, webentwicklung">
            </div>
          </div>
          
          <div class="form-row">
            <div class="form-group">
              <label>Meta Titel (SEO)</label>
              <input type="text" id="postMetaTitle">
            </div>
            <div class="form-group">
              <label>Meta Description (SEO)</label>
              <input type="text" id="postMetaDescription">
            </div>
          </div>
        </form>
      </div>
      <div class="modal-actions">
        <button class="btn" style="background: #6c757d; color: #fff;" onclick="savePost('draft')">Als Entwurf speichern</button>
        <button class="btn btn-primary" onclick="savePost('published')">Veröffentlichen</button>
      </div>
    </div>
  </div>

  <script>
    let currentStatus = 'all';
    let allPosts = [];

    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('expanded');
      localStorage.setItem('sidebarExpanded', document.getElementById('sidebar').classList.contains('expanded'));
    }
    if (localStorage.getItem('sidebarExpanded') === 'true') {
      document.getElementById('sidebar').classList.add('expanded');
    }

    // Tabs
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentStatus = tab.dataset.status;
        displayPosts();
      });
    });

    // Load Posts
    async function loadPosts() {
      try {
        const response = await fetch('/api/admin/blog');
        allPosts = await response.json();
        displayPosts();
      } catch (error) {
        console.error('[v0] Error loading posts:', error);
      }
    }

    function displayPosts() {
      const list = document.getElementById('postsList');
      let filtered = allPosts;
      
      if (currentStatus !== 'all') {
        filtered = allPosts.filter(p => p.status === currentStatus);
      }
      
      if (filtered.length === 0) {
        list.innerHTML = '<div style="padding: 40px; text-align: center; color: #999;">Keine Artikel gefunden</div>';
        return;
      }
      
      list.innerHTML = filtered.map(post => `
        <div class="post-item" onclick="editPost('${post.id}')">
          <div class="post-info">
            <h3>${post.title}</h3>
            <div class="post-meta">
              ${post.category || 'Ohne Kategorie'} • 
              ${new Date(post.created_at).toLocaleDateString('de-CH')} •
              ${post.views || 0} Aufrufe
            </div>
          </div>
          <span class="post-status status-${post.status}">${post.status === 'published' ? 'Veröffentlicht' : 'Entwurf'}</span>
        </div>
      `).join('');
    }

    // Editor
    function openEditor() {
      document.getElementById('editorTitle').textContent = 'Neuer Blog-Artikel';
      document.getElementById('postForm').reset();
      document.getElementById('postId').value = '';
      document.getElementById('editorModal').classList.add('active');
    }

    function closeEditor() {
      document.getElementById('editorModal').classList.remove('active');
    }

    function editPost(id) {
      const post = allPosts.find(p => p.id === id);
      if (!post) return;
      
      document.getElementById('editorTitle').textContent = 'Artikel bearbeiten';
      document.getElementById('postId').value = post.id;
      document.getElementById('postTitle').value = post.title;
      document.getElementById('postSlug').value = post.slug;
      document.getElementById('postCategory').value = post.category || '';
      document.getElementById('postExcerpt').value = post.excerpt || '';
      document.getElementById('postContent').value = post.content;
      document.getElementById('postImage').value = post.featured_image || '';
      document.getElementById('postTags').value = (post.tags || []).join(', ');
      document.getElementById('postMetaTitle').value = post.meta_title || '';
      document.getElementById('postMetaDescription').value = post.meta_description || '';
      
      document.getElementById('editorModal').classList.add('active');
    }

    async function savePost(status) {
      const id = document.getElementById('postId').value;
      const title = document.getElementById('postTitle').value;
      
      if (!title) {
        alert('Bitte Titel eingeben');
        return;
      }
      
      const slug = document.getElementById('postSlug').value || 
                   title.toLowerCase().replace(/[^a-z0-9]+/g, '-');
      
      const tags = document.getElementById('postTags').value
        .split(',')
        .map(t => t.trim())
        .filter(t => t);
      
      const data = {
        title,
        slug,
        excerpt: document.getElementById('postExcerpt').value,
        content: document.getElementById('postContent').value,
        featured_image: document.getElementById('postImage').value,
        category: document.getElementById('postCategory').value,
        tags,
        meta_title: document.getElementById('postMetaTitle').value,
        meta_description: document.getElementById('postMetaDescription').value,
        status,
        published_at: status === 'published' ? new Date().toISOString() : null
      };
      
      try {
        const url = id ? `/api/admin/blog/${id}` : '/api/admin/blog';
        const method = id ? 'PUT' : 'POST';
        
        const response = await fetch(url, {
          method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        
        if (response.ok) {
          await loadPosts();
          closeEditor();
        } else {
          alert('Fehler beim Speichern');
        }
      } catch (error) {
        console.error('[v0] Save error:', error);
        alert('Fehler beim Speichern');
      }
    }

    // Auto-generate slug from title
    document.getElementById('postTitle').addEventListener('input', (e) => {
      if (!document.getElementById('postId').value) {
        const slug = e.target.value.toLowerCase().replace(/[^a-z0-9]+/g, '-');
        document.getElementById('postSlug').value = slug;
      }
    });

    loadPosts();
  </script>
</body>
</html>
