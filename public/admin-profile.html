<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profil - Binso Admin</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif; 
      background: #ffffff;
      color: #000000;
    }
    
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      width: 70px;
      height: 100vh;
      background: #000000;
      color: #ffffff;
      transition: width 0.3s ease;
      z-index: 1000;
      overflow: hidden;
    }
    
    .sidebar.expanded { width: 280px; }
    
    .sidebar-header {
      padding: 20px;
      border-bottom: 1px solid #333333;
      display: flex;
      align-items: center;
      height: 70px;
    }
    
    .hamburger-btn {
      background: transparent;
      border: none;
      width: 30px;
      height: 30px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .hamburger-btn:hover { opacity: 0.7; }
    
    .sidebar-logo {
      font-size: 22px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: -0.5px;
      white-space: nowrap;
      margin-left: 16px;
      opacity: 0;
      width: 0;
      overflow: hidden;
      transition: opacity 0.3s, width 0.3s;
    }
    
    .sidebar.expanded .sidebar-logo {
      opacity: 1;
      width: auto;
    }
    
    .sidebar-nav { padding: 8px 0; }
    
    .nav-item {
      display: flex;
      align-items: center;
      padding: 14px 20px;
      color: #999999;
      text-decoration: none;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      white-space: nowrap;
    }
    
    .nav-item:hover {
      background: #1a1a1a;
      color: #ffffff;
    }
    
    .nav-item.active {
      background: #1a1a1a;
      color: #ffffff;
    }
    
    .nav-item.active::before {
      content: '';
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 3px;
      background: #ffffff;
    }
    
    .nav-icon {
      min-width: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    
    .nav-text {
      margin-left: 16px;
      opacity: 0;
      width: 0;
      overflow: hidden;
      transition: opacity 0.3s, width 0.3s;
    }
    
    .sidebar.expanded .nav-text {
      opacity: 1;
      width: auto;
    }
    
    .logout-section {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      border-top: 1px solid #333333;
      padding: 8px 0;
    }
    
    .main-content {
      margin-left: 70px;
      transition: margin-left 0.3s ease;
      min-height: 100vh;
    }
    
    .main-content.shifted { margin-left: 280px; }
    
    .header { 
      background: #ffffff; 
      border-bottom: 1px solid #e5e5e5; 
      padding: 24px 40px;
    }
    
    .header h1 { 
      font-size: 28px; 
      color: #000000; 
      font-weight: 600;
      letter-spacing: -0.5px;
    }
    
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
      padding: 40px;
    }
    
    .form-card {
      background: #ffffff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
      padding: 32px;
    }
    
    .form-group {
      margin-bottom: 24px;
    }
    
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 8px;
      color: #000000;
    }
    
    .form-group input {
      width: 100%;
      padding: 12px;
      border: 1px solid #e5e5e5;
      border-radius: 4px;
      font-size: 14px;
      transition: border-color 0.2s;
    }
    
    .form-group input:focus {
      outline: none;
      border-color: #000000;
    }
    
    .btn {
      padding: 12px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
    }
    
    .btn-primary {
      background: #000000;
      color: #ffffff;
    }
    
    .btn-primary:hover {
      background: #333333;
    }
    
    .alert {
      padding: 12px 16px;
      border-radius: 4px;
      margin-bottom: 24px;
      font-size: 14px;
    }
    
    .alert-success {
      background: #f0f0f0;
      color: #000000;
      border: 1px solid #e5e5e5;
    }
    
    .alert-error {
      background: #f0f0f0;
      color: #000000;
      border: 1px solid #e5e5e5;
    }
  </style>
</head>
<body>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <button class="hamburger-btn" onclick="toggleSidebar()">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>
      <div class="sidebar-logo">binso</div>
    </div>
    
    <nav class="sidebar-nav">
      <a href="/admin-dashboard.html" class="nav-item">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="7"/>
            <rect x="14" y="3" width="7" height="7"/>
            <rect x="14" y="14" width="7" height="7"/>
            <rect x="3" y="14" width="7" height="7"/>
          </svg>
        </div>
        <span class="nav-text">Dashboard</span>
      </a>
      
      <a href="/admin-portfolio.html" class="nav-item">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="nav-text">Portfolio</span>
      </a>
      
      <a href="/admin-services.html" class="nav-item">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M12 1v6m0 6v6m9-9h-6m-6 0H3"/>
          </svg>
        </div>
        <span class="nav-text">Dienstleistungen</span>
      </a>
      
      <a href="/admin-team.html" class="nav-item">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
        </div>
        <span class="nav-text">Team</span>
      </a>
      
      <a href="/admin-testimonials.html" class="nav-item">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
        </div>
        <span class="nav-text">Testimonials</span>
      </a>
      
      <a href="/admin-contacts.html" class="nav-item">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
        </div>
        <span class="nav-text">Kontakte</span>
      </a>
      
      <a href="/admin-faqs.html" class="nav-item">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"/>
            <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/>
            <line x1="12" y1="17" x2="12.01" y2="17"/>
          </svg>
        </div>
        <span class="nav-text">FAQs</span>
      </a>
    </nav>
    
    <div class="logout-section">
      <a href="/admin-profile.html" class="nav-item active">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <span class="nav-text">Profil</span>
      </a>
      
      <a href="#" class="nav-item" onclick="logout(); return false;">
        <div class="nav-icon">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </div>
        <span class="nav-text">Abmelden</span>
      </a>
    </div>
  </div>
  
  <div class="main-content" id="mainContent">
    <div class="header">
      <h1>Profil</h1>
    </div>
    
    <div class="container">
      <div id="alert-container"></div>
      
      <div class="form-card">
        <form id="profile-form">
          <div class="form-group">
            <label for="name">Name</label>
            <input type="text" id="name" name="name" required>
          </div>
          
          <div class="form-group">
            <label for="email">E-Mail</label>
            <input type="email" id="email" name="email" required>
          </div>
          
          <div class="form-group">
            <label for="password">Neues Passwort (optional)</label>
            <input type="password" id="password" name="password" placeholder="Leer lassen, um nicht zu ändern">
          </div>
          
          <div class="form-group">
            <label for="password-confirm">Passwort bestätigen</label>
            <input type="password" id="password-confirm" name="password-confirm">
          </div>
          
          <button type="submit" class="btn btn-primary">Speichern</button>
        </form>
      </div>
    </div>
  </div>
  
  <script>
    function toggleSidebar() {
      const sidebar = document.getElementById('sidebar');
      const mainContent = document.getElementById('mainContent');
      sidebar.classList.toggle('expanded');
      mainContent.classList.toggle('shifted');
      localStorage.setItem('sidebarExpanded', sidebar.classList.contains('expanded'));
    }
    
    window.addEventListener('DOMContentLoaded', () => {
      const isExpanded = localStorage.getItem('sidebarExpanded') === 'true';
      if (isExpanded && window.innerWidth > 768) {
        document.getElementById('sidebar').classList.add('expanded');
        document.getElementById('mainContent').classList.add('shifted');
      }
      loadProfile();
    });
    
    function logout() {
      document.cookie = 'admin-session=; Max-Age=0; path=/';
      window.location.href = '/admin/login';
    }
    
    function showAlert(message, type) {
      const alertContainer = document.getElementById('alert-container');
      alertContainer.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
      setTimeout(() => {
        alertContainer.innerHTML = '';
      }, 5000);
    }
    
    async function loadProfile() {
      try {
        const response = await fetch('/api/admin/profile');
        const data = await response.json();
        
        if (data.error) {
          showAlert('Fehler beim Laden des Profils', 'error');
          return;
        }
        
        document.getElementById('name').value = data.name || '';
        document.getElementById('email').value = data.email || '';
      } catch (error) {
        console.error('Error loading profile:', error);
        showAlert('Fehler beim Laden des Profils', 'error');
      }
    }
    
    document.getElementById('profile-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const passwordConfirm = document.getElementById('password-confirm').value;
      
      if (password && password !== passwordConfirm) {
        showAlert('Passwörter stimmen nicht überein', 'error');
        return;
      }
      
      try {
        const body = { name, email };
        if (password) {
          body.password = password;
        }
        
        const response = await fetch('/api/admin/profile', {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });
        
        const data = await response.json();
        
        if (data.error) {
          showAlert(data.error, 'error');
          return;
        }
        
        showAlert('Profil erfolgreich aktualisiert', 'success');
        document.getElementById('password').value = '';
        document.getElementById('password-confirm').value = '';
      } catch (error) {
        console.error('Error updating profile:', error);
        showAlert('Fehler beim Aktualisieren des Profils', 'error');
      }
    });
  </script>
</body>
</html>
